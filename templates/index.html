<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Web Service</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>🌟 Welcome to My Web Service App</h1>
        <p>This is a beautiful and interactive FastAPI-powered website!</p>
        <button onclick="greet()">Click Me!</button>
        <div id="greeting"></div>
    </div>

    <script>
        function greet() {
            document.getElementById('greeting').innerText = "🚀 Hello from the backend!";
        }
    </script>
</body>
</html>
